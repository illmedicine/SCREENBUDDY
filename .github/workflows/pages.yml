# The old GitHub Pages address (https://illmedicine.github.io/SCREENBUDDY/) now only forwards to the real site,
# https://screenbuddy.web.app, so old links keep working. The website itself is deployed to Firebase Hosting by
# .github/workflows/firebase.yml. This workflow runs only when the redirect page below changes, or by hand.
name: Pages redirect

on:
  push:
    branches: [main]
    paths:
      - '.github/pages-redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
