# Publishes the web player (screen-buddy-starter/web) to GitHub Pages.
# The web player is a separate, compatible version of Screen Buddy: the Android app lives in
# screen-buddy-starter/android and is not built or deployed here.
#
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy web player

on:
  push:
    branches: [main]
    paths:
      - 'screen-buddy-starter/web/**'
      - 'screen-buddy-starter/billing/**'   # the web tests check the shared catalog and scenarios
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screen-buddy-starter/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: screen-buddy-starter/web
      - id: deployment
        uses: actions/deploy-pages@v4
