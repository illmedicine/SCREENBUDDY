# Deploys the website to Firebase Hosting (https://screenbuddy.web.app) and publishes the Firestore security rules
# whenever they change on main. Needs one repository secret, FIREBASE_SERVICE_ACCOUNT: the JSON key of a service account
# in project screen-buddy-f968b. Until it exists this workflow just says so and finishes without deploying.
# Setup steps: screen-buddy-starter/FIREBASE.md ("Automatic deploys").
name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'screen-buddy-starter/web/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Is the deploy key set up?
        id: key
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set, so nothing was deployed. See screen-buddy-starter/FIREBASE.md."; fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      - name: Test the web player
        if: steps.key.outputs.present == 'true'
        working-directory: screen-buddy-starter/web
        run: npm test

      - name: Deploy hosting and rules
        if: steps.key.outputs.present == 'true'
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --project screen-buddy-f968b --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
