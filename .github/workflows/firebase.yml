# Deploys the website to Firebase Hosting (https://screenbuddy.web.app) and publishes the Firestore security rules
# whenever they change on main.
#
# No password or key is stored in GitHub. The job proves who it is to Google with a short-lived GitHub identity token
# (Workload Identity Federation) and acts as the service account github-deploy. Your organisation blocks service-account
# keys, so this is the supported way. Setup (one time, in Google Cloud Shell): screen-buddy-starter/FIREBASE.md.
#
# The job stays switched off until the repository variable FIREBASE_DEPLOY is set to true, so pushes don't fail
# before the setup is done:   gh variable set FIREBASE_DEPLOY --body true --repo illmedicine/SCREENBUDDY
name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'screen-buddy-starter/web/**'
      - 'screen-buddy-starter/billing/**'   # the web tests check the shared catalog and scenarios
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firestore-tests/**'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # lets the job ask GitHub for its identity token

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  # /firestore.rules against the Firestore emulator. The rules are only deployed when this passes.
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test the security rules
        working-directory: firestore-tests
        run: npm install --no-audit --no-fund && npx firebase emulators:exec --only firestore --project demo-screenbuddy "node --test rules.test.mjs"

  deploy:
    needs: rules-test
    if: ${{ always() && vars.FIREBASE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the web player
        working-directory: screen-buddy-starter/web
        run: npm test

      - name: Sign in to Google Cloud (no key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/520820829327/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deploy@screen-buddy-f968b.iam.gserviceaccount.com

      - name: Deploy the website
        run: npx --yes firebase-tools@15 deploy --only hosting --project screen-buddy-f968b --non-interactive

      - name: Deploy the security rules (only when their tests passed)
        if: ${{ needs.rules-test.result == 'success' }}
        run: npx --yes firebase-tools@15 deploy --only firestore:rules --project screen-buddy-f968b --non-interactive
